name: Check Sentinel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TRY_COMPILE_CONFIGURATION=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test native code
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test migration and packaging
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build Lua 5.4 interpreter
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 https://www.lua.org/ftp/lua-5.4.8.tar.gz -o "$RUNNER_TEMP/lua-5.4.8.tar.gz"
          echo "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae  $RUNNER_TEMP/lua-5.4.8.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lua-5.4.8.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.4.8" generic -j2
      - name: Check both UI packs
        if: runner.os == 'Linux'
        run: |
          "$RUNNER_TEMP/lua-5.4.8/src/lua" tools/check_ui.lua ui/modern/sentinel.lua
          "$RUNNER_TEMP/lua-5.4.8/src/lua" tools/check_ui.lua ui/gamepad/sentinel.lua
