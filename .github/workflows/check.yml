name: Check Sentinel
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SENTINEL_VERSION: 1.0.0-preview.7
jobs:
  native:
    name: Build and check ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            configure: -A x64
            binary_dir: build/Release
          - os: ubuntu-22.04
            platform: linux-x64
            configure: ""
            binary_dir: build
          # macos-15 is the native ARM64 runner; macos-15-intel is a different image.
          - os: macos-15
            platform: macos-arm64
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
            binary_dir: build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TRY_COMPILE_CONFIGURATION=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test native code
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test migration and packaging
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build Lua 5.4 interpreter
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://www.lua.org/ftp/lua-5.4.8.tar.gz -o "$RUNNER_TEMP/lua-5.4.8.tar.gz"
          python -c 'import hashlib, os, pathlib; p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lua-5.4.8.tar.gz"; assert hashlib.sha256(p.read_bytes()).hexdigest() == "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae", "Lua download SHA-256 mismatch"'
          tar -xzf "$RUNNER_TEMP/lua-5.4.8.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.4.8" generic -j2
      - name: Check both UI packs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$RUNNER_TEMP/lua-5.4.8/src/lua" tools/check_ui.lua ui/modern/sentinel.lua
          "$RUNNER_TEMP/lua-5.4.8/src/lua" tools/check_ui.lua ui/gamepad/sentinel.lua
      - name: Check Linux architecture and linked libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          file build/sentinel.so | grep 'ELF 64-bit.*x86-64'
          ldd build/sentinel.so
          if ldd build/sentinel.so | grep -q 'not found'; then exit 1; fi
      - name: Verify ARM64 and ad-hoc sign the macOS library
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          file build/sentinel.dylib
          test "$(lipo -archs build/sentinel.dylib)" = arm64
          codesign --force --sign - --timestamp=none build/sentinel.dylib
          codesign --verify --strict --verbose=2 build/sentinel.dylib
          otool -L build/sentinel.dylib
      - name: Package this platform
        run: python tools/package.py --version "${{ env.SENTINEL_VERSION }}" --platform "${{ matrix.platform }}" --build-dir "${{ matrix.binary_dir }}" --out package
      - name: Upload verified platform package
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ matrix.platform }}-${{ github.sha }}
          path: |
            package/hailstone-addon.txt
            package/*.zip
          if-no-files-found: error
          retention-days: 14
